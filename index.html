<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo Secreto – Primos Zandonadi</title>
<style>
:root{--red:#c0392b;--dark:#0f3d2e;--gold:#f5c542;--cream:#fff8ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--cream);
 background:linear-gradient(#0b2e23,#14543f 60%,#0b2e23);min-height:100vh;overflow-x:hidden}
.ban{position:relative;max-width:560px;margin:0 auto;border-bottom:4px solid var(--gold)}
.ban img{width:100%;display:block}
.ban svg{position:absolute;pointer-events:none;filter:drop-shadow(0 2px 2px #0006)}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px;text-align:center;position:relative;z-index:1}
h1{font-size:clamp(1.6rem,7vw,2.4rem);margin:.3em 0 0;text-shadow:0 2px 0 #000a}
.deco{font-size:2rem;letter-spacing:.3em}
.sub{opacity:.85;margin:.2em 0 1em}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.chip{border:2px solid var(--gold);background:#ffffff14;color:var(--cream);border-radius:999px;padding:10px 16px;font-size:1rem;cursor:pointer;min-height:44px}
.chip.sel{background:var(--gold);color:#3b2300;font-weight:700}
.chip.done{background:#2e9e5b;border-color:#2e9e5b;color:#fff;cursor:default}
.dice{font-size:min(30vw,150px);line-height:1;background:none;border:0;cursor:pointer;filter:drop-shadow(0 6px 10px #0008)}
.dice:disabled{opacity:.35;cursor:not-allowed}
.dice.roll{animation:roll .9s ease-in-out}
@keyframes roll{0%{transform:rotate(0)}30%{transform:rotate(200deg) scale(1.2)}60%{transform:rotate(420deg) scale(.9)}100%{transform:rotate(720deg)}}
.go{display:block;font-size:1.3rem;font-weight:800;color:var(--gold)}
.card{background:var(--cream);color:#3b1d10;border-radius:20px;padding:20px;margin-top:10px;box-shadow:0 8px 24px #0009;border:4px dashed var(--red)}
.card .lbl{font-size:.95rem;opacity:.75}
.foto{width:130px;height:130px;border-radius:50%;object-fit:cover;border:5px solid var(--red);margin:10px auto;display:block;background:#fff}
.emoji{font-size:80px;margin:6px 0}
.nome{font-size:2.4rem;font-weight:800;color:var(--red);margin:.1em 0 .4em}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{flex:1 1 150px;border:0;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;background:var(--red);color:#fff;min-height:48px}
.btn.alt{background:var(--dark)}
.btn.gold{background:var(--gold);color:#3b2300;flex-basis:100%}
#somBtn{position:fixed;top:10px;right:10px;z-index:5;width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:#0b2e23cc;color:#fff;font-size:1.3rem;cursor:pointer}
.msg{margin-top:12px;min-height:1.4em;color:#ffd6d6;font-weight:600}
.hidden{display:none}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.snow i{position:absolute;top:-10px;color:#fff;animation:fall linear infinite;opacity:.8}
@keyframes fall{to{transform:translateY(105vh)}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="ban" id="ban"><img src="banner.jpg" alt="Primos Zandonadi"></div>
<main>
  <div class="deco">🎅 🦌 🎄 🦌 🎅</div>
  <h1>Primos Zandonadi</h1>
  <p class="sub">Amigo Secreto de Natal · toque no seu nome e depois no dado</p>

  <div class="chips" id="chips"></div>

  <div id="sorteio">
    <button class="dice" id="dice" disabled aria-label="Sortear amigo secreto">🎲</button>
    <span class="go">SORTEAR AMIGO SECRETO</span>
  </div>

  <div class="card hidden" id="card">
    <div class="lbl">Seu amigo secreto é</div>
    <div id="visual"></div>
    <div class="nome" id="nome"></div>
    <div class="btns">
      <button class="btn" id="baixar">⬇️ Baixar imagem</button>
      <button class="btn alt" id="copiar">📋 Copiar nome</button>
      <button class="btn gold" id="lista">👥 Ver quem já sorteou</button>
    </div>
  </div>
  <button class="btn gold hidden" id="volta">⬅ Voltar ao meu resultado</button>
  <div class="msg" id="msg"></div>
  <audio id="musica" src="musica.mp3" loop preload="none"></audio>
  <button id="somBtn" aria-label="Ligar ou desligar a música">🔇</button>
</main>

<script>
// Preencha com a URL e a chave publicável do projeto Supabase.
const SUPABASE_URL = "https://qlzwvvaukiaozjgmkoph.supabase.co";
const SUPABASE_KEY = "sb_publishable_4om6A41X3-Tz4AP9yIl8rA_mA3xbNS7";

const $ = id => document.getElementById(id);
const foto = n => `fotos/${n.toLowerCase()}.jpg`;
let escolhido = null;

const ERROS = {
  ip_ja_usado: "Esta rede já fez 5 sorteios, que é o limite por IP. Fale com o organizador.",
  sem_opcao: "Não foi possível sortear agora. Fale com o organizador.",
  nome_ja_sorteou: "Esse nome já sorteou em outro aparelho.",
  nome_invalido: "Nome não encontrado.",
  sem_ip: "Não consegui identificar sua conexão. Tente de novo."
};

async function rpc(fn, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function mostrar(amigo) {
  $("sorteio").classList.add("hidden");
  $("chips").classList.add("hidden");
  $("nome").textContent = amigo;
  $("visual").innerHTML = "";
  const img = new Image();
  img.className = "foto"; img.alt = amigo; img.src = foto(amigo);
  img.onload = () => $("visual").replaceChildren(img);
  $("visual").innerHTML = '<div class="emoji">🎁</div>';
  $("card").classList.remove("hidden");
  $("card").dataset.amigo = amigo;
  try { localStorage.setItem("amigo", amigo); localStorage.setItem("quem", escolhido || ""); } catch (e) {}
}

async function iniciar() {
  let salvo = null, quem = null;
  try { salvo = localStorage.getItem("amigo"); quem = localStorage.getItem("quem"); } catch (e) {}
  try {
    const lista = await rpc("amigo_lista");
    // resultado salvo só vale se o banco ainda marca esse nome como sorteado (reset do organizador limpa)
    if (salvo && quem && lista.some(p => p.nome === quem && p.sorteou)) { escolhido = quem; return mostrar(salvo); }
    try { localStorage.clear(); } catch (e) {}
    desenharChips(lista, false);
  } catch (e) { $("msg").textContent = "Não consegui carregar a lista. Tente recarregar a página."; }
}

// verde = já sorteou, não clica (o resultado é secreto). ver=true: só consulta, ninguém clica.
function desenharChips(lista, ver) {
  $("chips").innerHTML = "";
  lista.forEach(p => {
    const b = document.createElement("button");
    b.className = "chip" + (p.sorteou ? " done" : ""); b.disabled = ver || p.sorteou;
    b.textContent = (p.sorteou ? "✓ " : "") + p.nome;
    b.onclick = () => {
      escolhido = p.nome; $("dice").disabled = false;
      document.querySelectorAll(".chip").forEach(c => c.classList.toggle("sel", c === b));
      $("msg").textContent = "";
    };
    $("chips").appendChild(b);
  });
}

$("lista").onclick = async () => {
  try {
    desenharChips(await rpc("amigo_lista"), true);
    $("card").classList.add("hidden"); $("chips").classList.remove("hidden"); $("volta").classList.remove("hidden");
    $("msg").textContent = "";
  } catch (e) { $("msg").textContent = "Não consegui carregar a lista. Tente de novo."; }
};
$("volta").onclick = () => {
  $("chips").classList.add("hidden"); $("volta").classList.add("hidden"); $("card").classList.remove("hidden");
};

// música: navegadores só tocam depois de um toque; começa no primeiro toque, o botão liga/desliga
const mus = $("musica"); let mudo = false; mus.volume = 0.5;
function atualizaMus() { $("somBtn").textContent = mus.paused ? "🔇" : "🔊"; }
$("somBtn").onclick = e => { e.stopPropagation(); mudo = !mus.paused; mudo ? mus.pause() : mus.play().catch(() => {}); atualizaMus(); };
document.addEventListener("pointerdown", () => { if (!mudo && mus.paused) mus.play().then(atualizaMus).catch(() => {}); }, { once: true });

$("dice").onclick = async () => {
  if (!escolhido) return;
  $("dice").disabled = true; $("dice").classList.add("roll");
  const espera = new Promise(r => setTimeout(r, 900));
  try {
    const [res] = await Promise.all([rpc("amigo_sortear", { p_nome: escolhido }), espera]);
    $("dice").classList.remove("roll");
    if (res.erro) { $("msg").textContent = ERROS[res.erro] || "Erro no sorteio."; return; }
    mostrar(res.amigo);
  } catch (e) {
    $("dice").classList.remove("roll"); $("dice").disabled = false;
    $("msg").textContent = "Falha de conexão. Tente de novo.";
  }
};

$("copiar").onclick = async () => {
  const n = $("card").dataset.amigo;
  try { await navigator.clipboard.writeText(n); } catch (e) {
    const t = document.createElement("textarea"); t.value = n; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
  }
  $("msg").textContent = "Nome copiado! 🎄";
};

function carregar(src) {
  return new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
}

async function desenhar(nome, comFoto) {
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1350;
  const g = c.getContext("2d");
  const bg = g.createLinearGradient(0, 0, 0, 1350); bg.addColorStop(0, "#0b2e23"); bg.addColorStop(1, "#14543f");
  g.fillStyle = bg; g.fillRect(0, 0, 1080, 1350);
  g.textAlign = "center"; g.fillStyle = "#fff";
  g.font = "90px serif"; g.fillText("🎅 🦌 🎄 🦌 🎅", 540, 140);
  g.font = "bold 70px sans-serif"; g.fillStyle = "#f5c542"; g.fillText("Primos Zandonadi", 540, 250);
  g.font = "48px sans-serif"; g.fillStyle = "#fff8ec"; g.fillText("Seu amigo secreto é", 540, 340);
  const img = comFoto ? await carregar(foto(nome)) : null;
  if (img) {
    g.save(); g.beginPath(); g.arc(540, 640, 230, 0, Math.PI * 2); g.clip();
    const s = Math.max(460 / img.width, 460 / img.height);
    g.drawImage(img, 540 - img.width * s / 2, 640 - img.height * s / 2, img.width * s, img.height * s);
    g.restore(); g.lineWidth = 12; g.strokeStyle = "#c0392b"; g.beginPath(); g.arc(540, 640, 230, 0, Math.PI * 2); g.stroke();
  } else { g.font = "300px serif"; g.fillText("🎁", 540, 740); }
  g.fillStyle = "#fff8ec"; g.font = "bold 140px sans-serif"; g.fillText(nome, 540, 1030);
  g.font = "70px serif"; g.fillText("🎄 Feliz Natal! 🎄", 540, 1200);
  return c;
}

$("baixar").onclick = async () => {
  const nome = $("card").dataset.amigo;
  let blob;
  try { blob = await new Promise(r => desenhar(nome, true).then(c => c.toBlob(r))); }
  catch (e) { blob = null; }
  // foto de origem diferente "suja" o canvas; nesse caso refaz sem foto
  if (!blob) blob = await new Promise(r => desenhar(nome, false).then(c => c.toBlob(r)));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `amigo-secreto-${nome}.png`; a.click();
};

// gorros: [centro x, base y, largura] em pixels da foto original (1600x1200)
const HAT = '<svg viewBox="0 0 100 90"><path d="M10 78C14 40 40 10 78 16C70 30 80 55 92 78Z" fill="#d62f2f"/><rect x="4" y="68" width="92" height="22" rx="11" fill="#fff"/><circle cx="80" cy="14" r="10" fill="#fff"/></svg>';
[[335,460,190],[598,490,150],[775,450,190],[910,405,170],[1080,195,200],
 [830,595,130],[1010,515,180],[1040,640,115],[560,668,200],[1300,680,190]].forEach(([x, y, w]) => {
  const d = document.createElement("div"); d.innerHTML = HAT; const s = d.firstChild;
  s.style.cssText = `left:${(x - w / 2) / 16}%;top:${(y - w * 0.9) / 12}%;width:${w / 16}%`;
  $("ban").appendChild(s);
});

// neve
for (let i = 0; i < 25; i++) {
  const f = document.createElement("i"); f.textContent = "❄";
  f.style.left = Math.random() * 100 + "vw"; f.style.fontSize = 10 + Math.random() * 16 + "px";
  f.style.animationDuration = 6 + Math.random() * 8 + "s"; f.style.animationDelay = -Math.random() * 10 + "s";
  $("snow").appendChild(f);
}
iniciar();
</script>
</body>
</html>
